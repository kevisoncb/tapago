<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Pagô — sistema para computador</title>
  <style>
    :root { --blue: #2f6bff; --dark: #0c1e5c; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; color: #fff;
      background: linear-gradient(180deg, var(--blue), var(--dark)); text-align: center; }
    main { max-width: 520px; }
    .logo { display: inline-flex; align-items: center; gap: 14px; font-size: 44px; font-weight: 800; }
    .mark { width: 56px; height: 56px; border-radius: 16px; background: #fff; display: grid; place-items: center; }
    h1 { font-size: 28px; margin: 28px 0 10px; }
    p { font-size: 18px; line-height: 1.5; color: #dee9ff; margin: 0 0 24px; }
    a.btn { display: inline-block; padding: 14px 26px; border-radius: 14px; background: #fff; color: var(--blue);
      font-weight: 700; text-decoration: none; margin: 6px; }
    small { display: block; margin-top: 28px; color: #b6c7f2; }
  </style>
</head>
<body>
  <main>
    <div class="logo">
      <span class="mark"><svg width="34" height="34" viewBox="0 0 96 96" aria-hidden="true"><path d="M22 50l19 19 33-40" fill="none" stroke="#2f6bff" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
      Pagô!
    </div>
    <h1>O sistema para computador está chegando</h1>
    <p>Em breve você vai usar a sua caderneta também no notebook ou no PC, com a mesma conta do celular.</p>
    <a class="btn" href="https://usepago.web.app">Conhecer o Pagô</a>
    <a class="btn" href="https://play.google.com/store/apps/details?id=app.usepago">Baixar na Google Play</a>
    <small>Enquanto isso, use o app no celular.</small>
  </main>
</body>
</html>
