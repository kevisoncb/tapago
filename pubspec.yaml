name: tapago_app
description: Pagô! — E aí, pagô? Caderneta de fiado e boletos da empresa.
publish_to: "none"
version: 2.4.0+24

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cloud_firestore: ^6.0.0
  crypto: ^3.0.6
  firebase_auth: ^6.1.0
  firebase_core: ^4.1.0
  flutter_local_notifications: ^19.4.0
  flutter_timezone: ^4.1.1
  google_fonts: ^6.3.2
  http: ^1.5.0
  google_mlkit_text_recognition: ^0.15.0
  image_picker: ^1.2.0
  in_app_purchase: ^3.2.3
  in_app_purchase_android: ^0.5.0
  intl: ^0.20.2
  local_auth: ^2.3.0
  provider: ^6.1.5
  shared_preferences: ^2.5.3
  speech_to_text: ^7.3.0
  timezone: ^0.10.1
  url_launcher: ^6.3.2
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  web:
    generate: true
  image_path: assets/brand/tapago-icon.jpg
  adaptive_icon_background: "#2F6BFF"
  adaptive_icon_foreground: assets/brand/tapago-icon.jpg

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/brand/
