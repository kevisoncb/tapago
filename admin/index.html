<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#2F6BFF" />
    <title>Pagô! Admin</title>
    <link rel="icon" href="pago-mark.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="admin.css?v=2" />
  </head>
  <body>
    <main id="login" class="login" hidden>
      <div class="login-card">
        <div class="brand"><img src="pago-mark.svg" alt="" /><span>Pagô!</span><em>Admin</em></div>
        <p class="muted">Entre com a sua conta de administrador.</p>
        <form id="login-form">
          <label>E-mail<input id="email" type="email" autocomplete="username" required /></label>
          <label>Senha<input id="password" type="password" autocomplete="current-password" required /></label>
          <button type="submit" class="btn primary" id="login-btn">Entrar</button>
          <p id="login-error" class="error" role="alert"></p>
        </form>
      </div>
    </main>

    <div id="app" hidden>
      <header class="top">
        <div class="brand"><img src="pago-mark.svg" alt="" /><span>Pagô!</span><em>Admin</em></div>
        <div class="top-actions">
          <span id="updated" class="muted small"></span>
          <button class="btn ghost" id="refresh" title="Atualizar">Atualizar</button>
          <button class="btn ghost" id="password-btn">Trocar senha</button>
          <button class="btn ghost" id="logout">Sair</button>
        </div>
      </header>

      <section class="stats" id="stats"></section>

      <section class="panel">
        <div class="panel-head">
          <h2>Cadastros nos últimos 14 dias</h2>
        </div>
        <div class="chart" id="chart"></div>
      </section>

      <section class="panel">
        <div class="panel-head">
          <h2>Pessoas <span id="count" class="muted"></span></h2>
          <input id="search" type="search" placeholder="Buscar nome, e-mail ou telefone" />
        </div>
        <div class="chips" id="filters">
          <button data-filter="all" class="chip active">Todos</button>
          <button data-filter="online" class="chip">Online</button>
          <button data-filter="premium" class="chip">Premium</button>
          <button data-filter="free" class="chip">Grátis</button>
          <button data-filter="expiring" class="chip">Vence em 7 dias</button>
        </div>
        <div id="users" class="users"></div>
      </section>
      <p class="foot muted small">
        A caderneta das pessoas (nomes e valores dos clientes delas) não aparece aqui. Só os números de uso.
        Contas de administrador ficam fora das contagens.
      </p>
    </div>

    <div id="toast" class="toast" role="status"></div>
    <script type="module" src="admin.js?v=2"></script>
  </body>
</html>
