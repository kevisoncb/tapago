name: pago_app
description: Pagô — caderneta de fiado, a prazo e empréstimo.
publish_to: "none"
version: 2.4.0+25

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cloud_firestore: ^6.0.0
  crypto: ^3.0.6
  firebase_auth: ^6.1.0
  firebase_core: ^4.1.0
  firebase_messaging: ^16.0.0
  flutter_local_notifications: ^19.4.0
  flutter_timezone: ^4.1.1
  google_fonts: ^6.3.2
  http: ^1.5.0
  google_mlkit_text_recognition: ^0.15.0
  image_picker: ^1.2.0
  in_app_purchase: ^3.2.3
  in_app_purchase_android: ^0.5.0
  in_app_purchase_storekit: ^0.4.13
  intl: ^0.20.2
  local_auth: ^2.3.0
  provider: ^6.1.5
  shared_preferences: ^2.5.3
  speech_to_text: ^7.3.0
  timezone: ^0.10.1
  url_launcher: ^6.3.2
  uuid: ^4.5.1
  firebase_crashlytics: ^5.4.0
  app_tracking_transparency: ^2.0.7
  appsflyer_sdk: 7.0.2+2
  pdf: ^3.12.0
  share_plus: ^13.3.1
  file_picker: ^13.3.0
  firebase_analytics: ^12.6.1
  play_install_referrer: ^0.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  web:
    generate: true
  image_path: assets/brand/pago-icon.jpg
  adaptive_icon_background: "#2F6BFF"
  adaptive_icon_foreground: assets/brand/pago-icon.jpg

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/brand/
    - assets/fonts/
  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/PlusJakartaSans-ExtraBold.ttf
          weight: 800
